name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'src/**'
      - 'index.ts'
      - '**/*.md'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'scripts/check-docs.cjs'
      - 'scripts/check-package.cjs'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'src/**'
      - 'index.ts'
      - '**/*.md'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'scripts/check-docs.cjs'
      - 'scripts/check-package.cjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation and check API examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix website --ignore-scripts
      - run: npx prettier --check '**/*.md' docs website .github/workflows/docs.yml
      - run: npx eslint website --max-warnings=0
      - run: npm run build
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run check:package
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/build
          retention-days: 1

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
